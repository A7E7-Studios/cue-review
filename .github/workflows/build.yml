name: Build installers

on:
  workflow_call:
    inputs:
      ref:
        description: Exact revision to build (empty uses the triggering revision)
        type: string
        required: false
        default: ''

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x64
            runner: windows-2022
            target: x86_64-pc-windows-msvc
          - name: linux-x64
            runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - name: macos-arm64
            runner: macos-15
            target: aarch64-apple-darwin
          - name: macos-x64
            runner: macos-15-intel
            target: x86_64-apple-darwin
    env:
      CARGO_INCREMENTAL: '0'
      APPIMAGE_EXTRACT_AND_RUN: '1'
      MACOSX_DEPLOYMENT_TARGET: '12.0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
        with:
          toolchain: 1.97.1
          targets: ${{ matrix.target }}
          components: rustfmt, clippy
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf libasound2-dev libpulse-dev pkg-config cmake gstreamer1.0-libav gstreamer1.0-plugins-bad gstreamer1.0-tools
          gst-inspect-1.0 avdec_h264
          gst-inspect-1.0 avdec_aac
          gst-inspect-1.0 h264parse
      - uses: Swatinem/rust-cache@e9d7b9f1e587218970671bac74e5511ed9506e6a # v2
        with:
          workspaces: src-tauri -> target
          key: ${{ matrix.target }}
          save-if: ${{ github.ref == 'refs/heads/main' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) }}
          cache-on-failure: true
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml --check
      - run: cargo test --manifest-path src-tauri/Cargo.toml --locked --target ${{ matrix.target }} --lib
      - run: cargo clippy --manifest-path src-tauri/Cargo.toml --locked --target ${{ matrix.target }} --all-targets -- -D warnings
      - name: Build bundled speech runtime
        run: node scripts/build-speech-runtime.mjs
      - name: Package desktop installers
        run: node scripts/package.mjs --target ${{ matrix.target }} --require-speech-runtime
      - name: Verify bundled executables
        run: node scripts/verify-bundle.mjs --target ${{ matrix.target }}
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: installer-${{ matrix.name }}
          path: .local/release-assets/*
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
