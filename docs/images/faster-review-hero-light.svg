<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="600" viewBox="0 0 1280 600" fill="none" role="img" aria-labelledby="hero-title hero-description">
  <title id="hero-title">Show the problem. Say what should change.</title>
  <desc id="hero-description">An illustration of a phone connected over USB for an Android review. A touch ring points to the Continue button in a fictional app, beside the spoken comment: This button doesn’t respond when I tap here. A small microphone and recording indicator represent commentary captured on the desktop.</desc>
  <defs>
    <radialGradient id="halo"><stop stop-color="#BDBDF2" stop-opacity=".22"/><stop offset="1" stop-color="#BDBDF2" stop-opacity="0"/></radialGradient>
    <filter id="phone-shadow" x="-40%" y="-20%" width="180%" height="155%"><feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#111129" flood-opacity=".16"/></filter>
    <clipPath id="screen-clip"><rect x="170" y="48" width="244" height="486" rx="30"/></clipPath>
  </defs>
  <ellipse cx="291" cy="302" rx="266" ry="280" fill="url(#halo)"/>
  <!-- The phone is illustrative; the recorder runs on the desktop. -->
  <g filter="url(#phone-shadow)">
    <rect x="158" y="36" width="268" height="510" rx="42" fill="#24242B" stroke="#50505B" stroke-width="1.5"/>
    <rect x="170" y="48" width="244" height="486" rx="30" fill="#FFFFFF"/>
    <g clip-path="url(#screen-clip)">
      <path d="M170 118H414" stroke="#E9E9F0"/>
      <circle cx="292" cy="65" r="5" fill="#24242B"/>
      <g font-family="Arial, Helvetica, sans-serif">
        <text x="191" y="103" fill="#18181B" font-size="20" font-weight="700">Library</text>
        <g transform="translate(376 84)" stroke="#66666F" stroke-width="1.8" stroke-linecap="round"><circle cx="6" cy="6" r="5"/><path d="m10 10 4 4"/></g>
        <rect x="190" y="139" width="204" height="161" rx="15" fill="#E7E7F6"/>
        <path d="M237 255V201C237 191 245 183 255 183H330C340 183 348 191 348 201V255" stroke="#5B5BD6" stroke-width="4"/>
        <path d="M229 234C229 229 233 225 238 225H347C352 225 356 229 356 234V256H229V234Z" fill="#5B5BD6"/>
        <path d="M239 255V270M346 255V270" stroke="#5B5BD6" stroke-width="4" stroke-linecap="round"/>
        <text x="191" y="334" fill="#18181B" font-size="20" font-weight="700">Studio collection</text>
        <text x="191" y="360" fill="#66666F" font-size="14">A few things worth a closer look.</text>
        <rect x="190" y="380" width="97" height="12" rx="6" fill="#E9E9F0"/>
        <rect x="294" y="380" width="62" height="12" rx="6" fill="#E9E9F0"/>
        <rect x="190" y="423" width="204" height="52" rx="15" fill="#5B5BD6"/>
        <text x="292" y="455" fill="#FFFFFF" font-size="17" font-weight="700" text-anchor="middle">Continue</text>
      </g>
      <rect x="254" y="518" width="76" height="4" rx="2" fill="#66666F" opacity=".5"/>
    </g>
    <path d="M156 154V209M428 154V234" stroke="#50505B" stroke-width="3" stroke-linecap="round"/>
  </g>
  <!-- One captured touch, kept separate from the fictional app's controls. -->
  <circle cx="354" cy="449" r="32" fill="#5B5BD6" fill-opacity=".12" stroke="#5B5BD6" stroke-opacity=".35" stroke-width="2"/>
  <circle cx="354" cy="449" r="20" stroke="#FFFFFF" stroke-width="3"/>
  <circle cx="354" cy="449" r="6" fill="#FFFFFF"/>
  <g font-family="Arial, Helvetica, sans-serif">
    <text x="510" y="113" fill="#66666F" font-size="16" font-weight="700" letter-spacing="2">SHOW IT. SAY IT. FIX IT.</text>
    <path d="M510 158C510 143 522 131 537 131H1130C1145 131 1157 143 1157 158V333C1157 348 1145 360 1130 360H537C522 360 510 348 510 333V236L480 218L510 199V158Z" fill="#F2F2FC" stroke="#E4E4F5"/>
    <text x="548" y="195" fill="#18181B" font-size="38" font-weight="600">
      <tspan x="548">“This button doesn’t</tspan>
      <tspan x="548" dy="52">respond when I</tspan>
      <tspan x="548" dy="52">tap here.”</tspan>
    </text>
    <rect x="510" y="396" width="247" height="56" rx="28" fill="#18181B"/>
    <circle cx="539" cy="424" r="6" fill="#FF6369"/>
    <g transform="translate(563 412)" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round"><rect x="4" y="0" width="8" height="15" rx="4"/><path d="M0 8V11C0 21 16 21 16 11V8M8 21V25M3 25H13"/></g>
    <path d="M599 421V427M607 416V432M615 412V436M623 418V430M631 415V433M639 420V428" stroke="#A3A3F5" stroke-width="3" stroke-linecap="round"/>
    <text x="660" y="430" fill="#FFFFFF" font-size="15" font-weight="600">Recording</text>
    <text x="510" y="496" fill="#66666F" font-size="19">Your words. The screen. Where you tapped.</text>
    <g transform="translate(184 569)">
      <path d="M0 -5V5M0 -3L-5 2V6M0 0L5 -4V-7" stroke="#66666F" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="0" cy="7" r="2" fill="#66666F"/>
      <path d="m-2 -4 2 -4 2 4z" fill="#66666F"/>
      <rect x="3" y="-9" width="4" height="4" rx=".5" fill="#66666F"/>
    </g>
    <text x="291" y="575" fill="#66666F" font-size="15" text-anchor="middle">Android capture over USB</text>
  </g>
</svg>
